<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dy1ce Packages</title>
    <style>
        :root { --bg: #000; --surface: #0a0a0a; --surface-light: #141414; --text: #fff; --text-muted: #666; --border: #222; --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.4; }
        
        header { position: fixed; top: 0; width: 100%; height: 60px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.1em; font-weight: 700; letter-spacing: 1px; }
        
        main { padding: 80px 20px 40px; max-width: 600px; margin: 0 auto; }
        
        /* Список */
        .app-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: 8px; overflow: hidden; }
        .app-item { background: var(--surface); padding: 20px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .app-item:active { background: var(--surface-light); }
        
        .app-info { flex: 1; min-width: 0; }
        .app-name { font-size: 1em; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-type { font-size: 0.7em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        .install-link { color: var(--text); text-decoration: none; font-size: 0.8em; font-weight: 600; padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px; transition: 0.2s; white-space: nowrap; margin-left: 15px; }
        .install-link:active { background: var(--text); color: #000; }
        
        .empty-msg { text-align: center; color: var(--text-muted); margin-top: 50px; padding: 20px; }
        .error-msg { color: #ff4444; }
    </style>
</head>
<body>
    <header>
        <div class="logo">Dy1ce Packages</div>
    </header>

    <main>
        <div id="appList" class="app-list"><div class="empty-msg">Загрузка из CyPwn...</div></div>
    </main>

    <script>
        // Прямая ссылка на JSON-фид CyPwn
        const CROWN_JSON_URL = "https://ipa.cypwn.xyz/cypwn.json";

        async function loadApps() {
            const container = document.getElementById('appList');
            
            try {
                const response = await fetch(CROWN_JSON_URL);
                if (!response.ok) throw new Error('Сеть ответила ошибкой');
                
                const data = await response.json();
                
                // Структура JSON у CyPwn может быть разной (массив или объект с apps)
                let apps = [];
                if (Array.isArray(data)) {
                    apps = data;
                } else if (data.apps && Array.isArray(data.apps)) {
                    apps = data.apps;
                } else {
                    // Если структура неизвестна, пробуем найти массив внутри
                    const firstArray = Object.values(data).find(val => Array.isArray(val));
                    if (firstArray) apps = firstArray;
                }

                if (apps.length === 0) {
                    container.innerHTML = '<div class="empty-msg">Данные получены, но приложения не найдены.</div>';
                    return;
                }

                renderApps(apps);
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="empty-msg error-msg">Ошибка загрузки. Возможно, CyPwn блокирует запросы с этого домена (CORS).</div>';
            }
        }

        function renderApps(apps) {
            const container = document.getElementById('appList');
            container.innerHTML = '';

            // Ограничим вывод, если приложений слишком много (чтобы не вешать телефон)
            const maxApps = 200; 
            const list = apps.slice(0, maxApps);

            list.forEach(app => {
                // Пытаемся вытащить данные из разных возможных полей JSON
                const name = app.name || app.title || app.bundleName || 'Unknown';
                const type = app.type || 'IPA';
                const link = app.downloadURL || app.downloadUrl || app.url || app.link || '#';

                const item = document.createElement('div');
                item.className = 'app-item';
                item.innerHTML = `
                    <div class="app-info">
                        <div class="app-name">${name}</div>
                        <div class="app-type">${type}</div>
                    </div>
                    <a href="${link}" class="install-link" target="_blank">Установить</a>
                `;
                container.appendChild(item);
            });

            if (apps.length > maxApps) {
                const note = document.createElement('div');
                note.className = 'empty-msg';
                note.innerText = `Показано ${maxApps} из ${apps.length}. Остальные скрыты для скорости.`;
                container.appendChild(note);
            }
        }

        loadApps();
    </script>
</body>
</html>
