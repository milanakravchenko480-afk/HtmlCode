<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Store</title>
    <style>
        /* Твои стили (оставил без изменений) */
        :root { --bg: #050505; --surface: #121212; --surface-light: #1e1e1e; --text: #e0e0e0; --text-muted: #888; --accent: #ffffff; --border: #2a2a2a; --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: var(--font); overflow-x: hidden; line-height: 1.4; }
        header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 100; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.2em; font-weight: 700; letter-spacing: 1px; }
        .menu-btn { cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 5px; z-index: 101;}
        .menu-btn span { display: block; width: 24px; height: 2px; background-color: var(--text); transition: 0.3s; }
        .menu-btn.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-btn.active span:nth-child(2) { opacity: 0; }
        .menu-btn.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
        .nav-menu { position: fixed; top: 60px; left: 0; width: 100%; background: var(--surface); border-bottom: 1px solid var(--border); transform: translateY(-100%); opacity: 0; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 99; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .nav-menu.active { transform: translateY(0); opacity: 1; }
        .nav-menu a { color: var(--text); text-decoration: none; font-size: 1.1em; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
        main { padding: 80px 20px 40px; max-width: 600px; margin: 0 auto; }
        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .app-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: transform 0.1s ease-out, background 0.2s; opacity: 0; transform: translateY(50px) rotateX(10deg); }
        .app-card.visible { opacity: 1; transform: translateY(0) rotateX(0deg); }
        .app-card:active { transform: scale(0.96); background: var(--surface-light); }
        .app-icon { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; margin-bottom: 12px; border: 1px solid var(--border); background: #000;}
        .app-title { font-size: 0.95em; font-weight: 600; margin-bottom: 4px; }
        .app-type { font-size: 0.75em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 1000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--surface); width: 90%; max-width: 400px; border-radius: 24px; padding: 25px; transform: scale(0.9) translateY(20px); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid var(--border); position: relative; max-height: 85vh; overflow-y: auto; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        .close-btn { position: absolute; top: 15px; right: 15px; width: 30px; height: 30px; background: var(--surface-light); border-radius: 50%; border: none; color: var(--text); font-size: 1.2em; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .modal-icon { width: 100px; height: 100px; border-radius: 22px; object-fit: cover; margin: 0 auto 15px; display: block; border: 1px solid var(--border); }
        .modal-title { font-size: 1.5em; font-weight: 700; text-align: center; margin-bottom: 5px; }
        .modal-type { font-size: 0.85em; color: var(--text-muted); text-align: center; margin-bottom: 20px; text-transform: uppercase; }
        .modal-desc { font-size: 0.95em; color: #bbb; margin-bottom: 20px; line-height: 1.5; }
        .btn-install { display: block; width: 100%; padding: 15px; background: var(--accent); color: #000; text-align: center; text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 1.1em; }
        .btn-install:active { opacity: 0.8; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85em; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1em; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--text-muted); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-btn { width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: 700; font-size: 1.1em; cursor: pointer; margin-top: 10px; }
        .form-btn:active { opacity: 0.8; }
        .empty-msg { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 1.1em; }
    </style>
</head>
<body>

    <header>
        <div class="logo">DARK STORE</div>
        <div class="menu-btn" onclick="toggleMenu()" id="menuBtn">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="nav-menu" id="navMenu">
        <a href="#" onclick="showMain()">Мои приложения</a>
        <a href="#" onclick="showEditor()">Добавить проект</a>
        <a href="#" onclick="alert('Настройки в разработке')">Настройки</a>
    </div>

    <main>
        <div class="app-grid" id="appGrid">
            <div class="empty-msg" id="emptyMsg">Загрузка...</div>
        </div>

        <div id="editorArea" style="display: none;">
            <h2 style="margin-bottom: 20px; font-weight: 600;">Новый проект</h2>
            <div class="form-group"><label>Название</label><input type="text" id="inpName" placeholder="Например: Minecraft"></div>
            <div class="form-group"><label>Ссылка на картинку (URL)</label><input type="text" id="inpImage" placeholder="https://.../icon.png"></div>
            <div class="form-group"><label>Тип</label><select id="inpType"><option value="iOS">iOS</option><option value="Android">Android</option><option value="TrollStore">TrollStore</option><option value="Jailbreak">Jailbreak</option></select></div>
            <div class="form-group"><label>Описание</label><textarea id="inpDesc" placeholder="Краткое описание..."></textarea></div>
            <div class="form-group"><label>Ссылка на скачивание</label><input type="text" id="inpLink" placeholder="https://.../app.ipa"></div>
            <button class="form-btn" onclick="publishApp()">Опубликовать</button>
        </div>
    </main>

    <div class="modal-overlay" id="appModal" onclick="closeApp(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeApp(event)">✕</button>
            <img src="" id="mIcon" class="modal-icon" alt="Icon">
            <div class="modal-title" id="mTitle"></div>
            <div class="modal-type" id="mType"></div>
            <div class="modal-desc" id="mDesc"></div>
            <a href="#" id="mLink" class="btn-install">Установить</a>
        </div>
    </div>

    <script>
        // Твой токен в Base64 (расшифруется на лету)
        const ENCODED_TOKEN = "Z2hwX2pKSVlCV3lLUU84VHBpNkZaQ2lUUXJLNjdBTFFBdTN2RU1BdQ==";
        const GITHUB_TOKEN = atob(ENCODED_TOKEN);
        
        const OWNER = "milanakravchenko480-afk";
        const REPO = "HtmlCode";
        const FILE_PATH = "apps.json";

        let currentApps = [];

        window.onload = () => {
            fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}?t=` + Date.now())
                .then(res => res.json())
                .then(data => {
                    const decoded = atob(data.content);
                    currentApps = JSON.parse(decoded);
                    renderApps(currentApps);
                })
                .catch(err => {
                    console.log('JSON пуст или не найден.');
                    document.getElementById('emptyMsg').style.display = 'block';
                });
        };

        function toggleMenu() {
            document.getElementById('menuBtn').classList.toggle('active');
            document.getElementById('navMenu').classList.toggle('active');
        }

        function showMain() {
            document.getElementById('appGrid').style.display = 'grid';
            document.getElementById('editorArea').style.display = 'none';
            toggleMenu();
            renderApps(currentApps);
        }

        function showEditor() {
            document.getElementById('appGrid').style.display = 'none';
            document.getElementById('editorArea').style.display = 'block';
            toggleMenu();
        }

        function renderApps(apps) {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';
            
            if (!apps || apps.length === 0) {
                grid.innerHTML = '<div class="empty-msg">Тут пока пусто. Нажми «Добавить проект» в меню.</div>';
                return;
            }

            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <img src="${app.image}" class="app-icon" onerror="this.src='https://via.placeholder.com/150/111111/ffffff?text=?'">
                    <div class="app-title">${app.name}</div>
                    <div class="app-type">${app.type}</div>
                `;
                card.onclick = () => openApp(app);
                grid.appendChild(card);
                setTimeout(() => card.classList.add('visible'), 50);
            });
        }

        async function publishApp() {
            const name = document.getElementById('inpName').value.trim();
            const image = document.getElementById('inpImage').value.trim();
            const type = document.getElementById('inpType').value;
            const desc = document.getElementById('inpDesc').value.trim();
            const link = document.getElementById('inpLink').value.trim();

            if (!name || !image || !link) {
                alert('Заполни хотя бы название, картинку и ссылку!');
                return;
            }

            const newApp = { name, image, type, description: desc, link };
            const btn = document.querySelector('.form-btn');
            btn.innerText = 'Отправка...';
            btn.disabled = true;

            try {
                // 1. Получаем текущий файл (чтобы узнать SHA)
                const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`);
                let currentContent = [];
                let sha = null;

                if (getRes.ok) {
                    const data = await getRes.json();
                    sha = data.sha;
                    const decoded = atob(data.content);
                    currentContent = JSON.parse(decoded);
                }

                // 2. Добавляем новое приложение
                currentContent.push(newApp);
                const newContentEncoded = btoa(JSON.stringify(currentContent, null, 2));

                // 3. Отправляем PUT запрос в GitHub
                const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Добавлено приложение: ${newApp.name}`,
                        content: newContentEncoded,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert('Приложение добавлено!');
                    location.reload(); // Перезагружаем страницу
                } else {
                    const err = await putRes.text();
                    alert('Ошибка GitHub: ' + err);
                }
            } catch (e) {
                alert('Ошибка сети: ' + e.message);
            } finally {
                btn.innerText = 'Опубликовать';
                btn.disabled = false;
            }
        }

        function openApp(app) {
            document.getElementById('mTitle').innerText = app.name;
            document.getElementById('mType').innerText = app.type;
            document.getElementById('mDesc').innerText = app.description;
            document.getElementById('mLink').href = app.link;
            document.getElementById('mIcon').src = app.image;
            document.getElementById('appModal').classList.add('active');
        }

        function closeApp(event) {
            if(event.target.id === 'appModal' || event.target.classList.contains('close-btn')) {
                document.getElementById('appModal').classList.remove('active');
            }
        }
    </script>
</body>
</html>
